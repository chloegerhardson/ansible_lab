---
- name: Install and configure Apache
  hosts: webservers
  become: yes
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      tags: ['install']

    - name: Install Apache
      apt:
        name: apache2
        state: present
        install_recommends: yes
      tags: ['install']

    - name: Deploy homepage
      template:
        src: index.html.j2
        dest: /var/www/html/index.html
      notify:
        - Restart Apache
      tags: ['deploy']

    - name: Ensure Apache is running
      service:
        name: apache2
        state: started
        enabled: yes
      tags: ['start']

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted

